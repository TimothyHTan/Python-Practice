<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffd43b'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='16' text-anchor='middle' fill='%2313213c'%3Epy%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=5">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode-standalone.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="index.html"><span class="logo-mark">py</span>Vertical World</a>
    <a href="practice.html">Practice</a>
    <a href="learn.html">Learn</a>
    <a href="plan.html" aria-current="page">7-day plan</a>
    <a href="progress.html">Progress</a>
    <a href="notes.html">Notes</a>
    <a href="settings.html">Settings</a>
  </nav>

  <main class="plan-page">
    <header class="plan-head">
      <h1>Seven days to the final</h1>
      <p id="plan-dates"></p>
      <div class="plan-total">
        <div class="bar" aria-hidden="true"><span id="total-bar"></span></div>
        <span id="total-text"></span>
      </div>
    </header>

    <div class="plan-grid">
      <ol class="days" id="days" aria-label="Days"></ol>

      <aside class="plan-side">
        <section>
          <h2>Before you submit</h2>
          <p class="side-help">From your pre-final notes. Tick them off as you check each submit; the ticks clear when you press Clear.</p>
          <ul class="checklist" id="checklist"></ul>
          <button class="ghost" id="clear-checks">Clear</button>
        </section>
        <section>
          <h2>Modules</h2>
          <ul class="module-progress" id="module-progress"></ul>
        </section>
      </aside>
    </div>
  </main>

  <script type="module" src="js/plan.js?v=5"></script>
  <script type="module" src="js/palette.js?v=5"></script>
</body>
</html>
